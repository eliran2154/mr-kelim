<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>הזמנה - מ.ר כלים</title><style>:root{--gold:#c9a84c;--gold2:#e8c97a;--bg:#0f0f1a;--card:#16213e;--border:#2a3f60;--text:#f0ead6}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;min-height:100vh;padding-bottom:calc(100px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}header{position:sticky;top:0;z-index:10;background:var(--card);padding:calc(16px + env(safe-area-inset-top)) 16px 14px;text-align:center;border-bottom:2px solid var(--gold)}header small{color:var(--gold);letter-spacing:3px}h1{margin:3px 0 0;font-size:24px}.wrap{padding:10px}.row{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:7px;direction:rtl}.row span{flex:1;text-align:right;direction:rtl;font-size:14px}.q{display:flex;direction:ltr;flex:0 0 auto;border:1px solid var(--border);border-radius:8px;overflow:hidden}.q button,.q input{width:36px;height:34px;border:0;background:var(--bg);color:var(--text);text-align:center;font-size:16px}.q button{color:var(--gold);font-size:20px}textarea{width:100%;min-height:70px;background:var(--card);color:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;font-family:inherit}.warn{text-align:center;color:var(--gold2);font-weight:700;margin:12px 0}footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--gold);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center}.send{padding:0 18px;height:42px;border:0;background:#25D366;color:#fff;border-radius:10px;font-weight:700}</style></head><body><header><small>✦ הזמנה ✦</small><h1>מ.ר כלים</h1></header><div class="wrap" id="products"></div><div class="wrap"><textarea id="notes" placeholder="הערות להזמנה..."></textarea><div class="warn">‼️ דווח חוסרים בהקדם האפשרי ‼️</div></div><footer><div><b id="count">0</b> פריטים</div><button class="send" onclick="sendOrder()">שלח הזמנה</button></footer><script>const PHONE='972544274897',RLE='\u202B',PDF='\u202C',RLM='\u200F';const PRODUCTS=['קרפט 500 מרק','מכסה מרק','קרפט 500','קרפט 750','מכסה 500/750','קרפט 1100','קרפט 1300','מכסה 1100','קרפט 1500','מכסה 1500','קרפט מלבן 500','קרפט מלבן 750','קרפט מלבן 1000','מכסה מלבן','גביע רוטב 1.5','גביע רוטב 2','גביע רוטב 3','גביע רוטב 4','מכסה לגביע רוטב','דליה לבן','גיילורד','קונוס צ׳יפס חום','קופסה לפיתה חום','מכסה כוס 12 שחור','‼️*לידע נהג לקח החזרות*‼️'];const wrap=document.getElementById('products');PRODUCTS.forEach(p=>{const r=document.createElement('div');r.className='row';r.innerHTML='<span></span><div class="q"><button onclick="chg(this,-1)">−</button><input type="number" min="0" value="0" inputmode="numeric"><button onclick="chg(this,1)">+</button></div>';r.querySelector('span').textContent=p;r.querySelector('input').oninput=refresh;wrap.appendChild(r)});function chg(b,d){const i=b.parentElement.querySelector('input');i.value=Math.max(0,(parseInt(i.value)||0)+d);refresh()}function refresh(){let t=0;document.querySelectorAll('.row input').forEach(i=>t+=parseInt(i.value)||0);count.textContent=t}function orderLine(name,q){return RLE+'• '+name+RLM+' : '+RLM+'*'+q+'*'+PDF}function sendOrder(){const lines=['🛒 *הזמנה - מ.ר כלים*','📅 '+new Date().toLocaleDateString('he-IL'),'─────────────────'];let total=0;document.querySelectorAll('.row').forEach(r=>{const q=parseInt(r.querySelector('input').value)||0;if(q>0){lines.push(orderLine(r.querySelector('span').textContent,q));total+=q}});if(!total){alert('לא נבחרו פריטים');return}const n=notes.value.trim();if(n)lines.push('','📝 *הערות:* '+n);lines.push('','─────────────────','✅ סה״כ: *'+total+' פריטים*','','‼️ *דווח חוסרים בהקדם האפשרי* ‼️','','*אשר*');location.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(lines.join('\n'))}</script></body></html>
